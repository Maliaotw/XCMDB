[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "pytz>=2024.1",
    "Pillow>=9.0.0",
    "redis>=4.5.0",
    "celery>=5.3.0",
    "requests>=2.28.0",
    "lxml>=5.0",
    "psutil>=5.9.0",
    "beautifulsoup4>=4.12.0",
    "paramiko>=3.0.0",
    "ipip-ipdb==1.3.2",
    "python-ldap>=3.0.0",
    "itsdangerous>=2.0.0",
    "python-telegram-bot>=20.0",
    "dwebsocket",
    "django>=4.2.0",
    "django-auth-ldap>=4.0.0",
    "django-celery-beat>=2.5.0",
    "django-environ>=0.10.0",
    "gunicorn>=21.0.0",
    "djangorestframework>=3.14.0",
    "django-filter>=23.0",
    "django-celery-results>=2.5.0",
    "pyvsphere",
    "pyesxi",
    "psycopg2-binary>=2.8",
    "pyvmomi<=8.0.3.0",
    "django-redis>=5.0.0",
    "drf-yasg>=1.21.0",
    "python-keycloak>=4.6.2",
    "setuptools>=82.0.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9.0",
    "mypy>=1.0",
    "pytest>=7.0",
    "pytest-django>=4.5",
    "pytest-cov>=4.0",
    "coverage>=7.0",
    "pre-commit>=3.0",
    "django-extensions>=2.0,<3.2",
]

[tool.uv]
override-dependencies = [
    "django-timezone-field>=5.0",
    "setuptools>=65.0.0,<70.0.0",
]

# Ruff: Linting + Formatting (replaces flake8, isort, black)
[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C90"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint.isort]
known-first-party = ["cmdb", "vm", "hosts", "assets", "tasks", "common", "authentication", "settings"]

# MyPy: Type checking
[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["pyvsphere.*", "pyesxi.*", "pyvmomi.*"]
ignore_missing_imports = true

# Pytest (fallback - Django test framework is primary)
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "cmdb.settings"
testpaths = ["cmdb"]
python_files = ["tests.py", "test_*.py"]

# Coverage
[tool.coverage.run]
source = ["cmdb", "tasks"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/__pycache__/*",
    "*/manage.py",
    "*/celery.py",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
