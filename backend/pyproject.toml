[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.8,<3.11"
dependencies = [
    "pytz==2020.1",
    "Pillow>=9.0.0",
    "redis==3.5.3",
    "celery==4.4.6",
    "requests==2.23.0",
    "lxml==4.5.1",
    "psutil==5.6.5",
    "beautifulsoup4==4.9.1",
    "paramiko==2.7.1",
    "ipip-ipdb==1.3.2",
    "PyMySQL==0.9.3",
    "python-ldap==3.3.1",
    "itsdangerous==0.24",
    "python-telegram-bot==12.8",
    "dwebsocket",
    "django==2.1.4",
    "django-auth-ldap==2.1.0",
    "django-celery-beat==2.0.0",
    "django-environ==0.4.5",
    "gunicorn==20.0.4",
    "djangorestframework==3.11.0",
    "django-filter==2.2.0",
    "django-celery-results==1.2.1",
    "pyvsphere",
    "pyesxi",
    "psycopg2-binary>=2.8",
    "pyvmomi<=8.0.3.0",
    "django-redis-cache>=3.0.1",
    "drf-yasg>=1.17.1",
    "python-keycloak>=4.6.2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9.0",
    "mypy>=1.0",
    "pytest>=7.0",
    "pytest-django>=4.5",
    "pytest-cov>=4.0",
    "coverage>=7.0",
    "pre-commit>=3.0",
    "django-extensions>=2.0,<3.2",
]

[tool.uv]
override-dependencies = [
    "django-timezone-field==3.1",
]

# Ruff: Linting + Formatting (replaces flake8, isort, black)
[tool.ruff]
line-length = 120
target-version = "py38"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C90"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint.isort]
known-first-party = ["cmdb", "vm", "hosts", "assets", "tasks", "common", "authentication", "settings"]

# MyPy: Type checking
[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["pyvsphere.*", "pyesxi.*", "pyvmomi.*"]
ignore_missing_imports = true

# Pytest (fallback - Django test framework is primary)
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "cmdb.settings"
testpaths = ["cmdb"]
python_files = ["tests.py", "test_*.py"]

# Coverage
[tool.coverage.run]
source = ["cmdb", "tasks"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/__pycache__/*",
    "*/manage.py",
    "*/celery.py",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
